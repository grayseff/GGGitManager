<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30343b"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a2a"/>
      <stop offset="0.55" stop-color="#e52b1b"/>
      <stop offset="1" stop-color="#a30d21"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dce1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- GNOME-friendly dark tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102" fill="none" stroke="#4b505a" stroke-width="3" opacity=".75"/>

  <!-- Documents behind repository -->
  <g filter="url(#soft)">
    <path d="M196 150h205a18 18 0 0 1 18 18v82H196z" fill="#c9cdd2"/>
    <path d="M184 137h205a18 18 0 0 1 18 18v82H184z" fill="url(#paper)"/>
  </g>

  <!-- Repository folder -->
  <g filter="url(#shadow)">
    <path d="M76 177a28 28 0 0 1 28-28h98l30 31h176a28 28 0 0 1 28 28v28H76z" fill="#ff7134"/>
    <path d="M61 211a30 30 0 0 1 30-30h108c9 0 17 4 23 11l19 22h174a30 30 0 0 1 30 30v190a34 34 0 0 1-34 34H95a34 34 0 0 1-34-34z" fill="url(#folder)"/>
    <path d="M72 412c61 25 147 32 242 19 45-6 89-18 123-34v27a34 34 0 0 1-34 34H95a34 34 0 0 1-34-34v-27c3 6 7 11 11 15z" fill="#8d0d20" opacity=".42"/>
  </g>

  <!-- Git branch -->
  <g fill="none" stroke="#fff3d8" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M174 303h145"/>
    <path d="M174 303c35 0 52-12 72-34l45-48"/>
    <path d="M174 303c35 0 52 12 72 34l38 39"/>
  </g>

  <!-- Branch nodes -->
  <g fill="#f0442e" stroke="#fff3d8" stroke-width="14" filter="url(#soft)">
    <circle cx="174" cy="303" r="35"/>
    <circle cx="291" cy="221" r="30"/>
    <circle cx="319" cy="303" r="30"/>
    <circle cx="284" cy="376" r="30"/>
  </g>

  <!-- subtle highlights -->
  <path d="M83 219c0-12 10-22 22-22h105" fill="none" stroke="#ffb18a" stroke-width="7" stroke-linecap="round" opacity=".55"/>
</svg>
